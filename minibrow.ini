; MiniBrow の設定ファイル (minibrow.exe と同じフォルダに置く)
[MiniBrow]
; 起動時とホームボタンで開くページ (about:home = 内蔵スタートページ)
Home=about:home
; アドレス欄に URL 以外を入力したときの検索 URL (語は UTF-8 で末尾に付く)
Search=http://frogfind.com/?q=
; サイトに名乗るブラウザの名前 (User-Agent)。空なら MiniBrow/<版番号> (Windows 95)
; (スクリプトの navigator.userAgent は Mozilla/4.0 (compatible; MiniBrow <版番号>; Windows 95))。
; 指定するとどちらにもこの値を使う。ほかのブラウザの名前にすると、そのブラウザ向けの
; (MiniBrow では表示できない) ページが送られてくることがある
UserAgent=
; HTTP プロキシ (ホスト名:ポート)。指定すると http/https とも全てプロキシ経由になる
; 空なら https は内蔵の TLS (BearSSL) で直接接続する
; 例: Proxy=192.168.1.10:8080
Proxy=
; https:// をプロキシ経由で見るときの方式。0 = CONNECT で暗号化したまま中継する (既定)。
; 1 = プロキシに "GET https://..." を平文で送る。Cookie やパスワードもプロキシまで暗号化されず、証明書の検証も
; しないので、自分の LAN の中の信頼できるプロキシ (古い PC 向けの中継など) でだけ使うこと
ProxyPlainHttps=0
; HTTP/1.1 で接続を使い回す (1 = 既定) / 要求ごとに HTTP/1.0 で接続して閉じる (0)。
; 1 では同じサーバへの次の要求 (画像・CSS など) を同じ接続で送るので、接続と TLS の接続処理の時間が省ける。
; 応答を受け取った接続は 4 本まで、15 秒まで待たせる。古いサーバやプロキシで具合が悪いときは 0 にする
KeepAlive=1
; 同じサーバへの CSS とスクリプトの要求を、使い回す 1 本の接続でまとめて送る (1 = 既定) / 1 つずつ送る (0)。
; 往復の待ち時間が 1 回分で済む。KeepAlive=0 のときは使わない。違うサーバのものは、この設定によらず別の接続で並行して取得する
Pipeline=1
; Proxy= を指定したとき、ftp:// もプロキシに任せる (1) / ftp:// だけは直接 FTP サーバにつなぐ (0)。
; 1 ではプロキシに "GET ftp://..." を送るので、FTP に対応したプロキシ (Squid など) が必要。
; Proxy= が空なら、ftp:// はいつも直接つなぐ (匿名ログイン。ftp://ユーザー:パスワード@ホスト/ も可)
FtpProxy=1
; HTTPS の証明書を cacert.pem で検証する (1)。0 にすると発行元を信頼できない
; 証明書も受け入れる (危険。有効期限とホス1ト名の検査は残る)
VerifyCert=1
; TLS 1.0 / 1.1 も使う (1) / TLS 1.2 以降だけを使う (0)。古いサーバや機器の管理画面が TLS 1.0 / 1.1 にしか
; 対応していないときだけ 1 にする (TLS 1.0 / 1.1 は今のブラウザーでは廃止されていて、安全性が低い)
OldTls=0
; cacert.pem がこの日数より古ければ、起動時に curl.se から更新を確認する (0 で無効)
; 更新は常に証明書を検証した直接の HTTPS で行い、公式の SHA-256 と照合する
CaUpdateDays=30
; Cookie の Domain= の判定に使う一覧 (psl.bin) がこの日数より古ければ、起動時に publicsuffix.org から取得する (0 で無効)
; 取得には cacert.pem が必要。一覧が無い間は簡易な判定で動く
PslUpdateDays=30
; ページが CSP の upgrade-insecure-requests を指定しているときに、そのページのスクリプト・CSS・画像・XHR・書体の
; http:// を https:// に読み替えて取得する (1) / 読み替えない (0)。0 では https のページの http のスクリプトなどは読まない
UpgradeInsecure=1
; https のページから http のスクリプト・CSS・XHR・書体を読み込むのを遮断する (1) / 遮断しない (0)。https から http への転送も同じ。
; 0 にすると、通信の途中で書き換えられたスクリプトが https のページの権限で動くおそれがある。画像はどちらでも読み込む
BlockMixedContent=1
; 画像を表示する (1) / しない (0)。JPEG・PNG・GIF・BMP・WebP・SVG に対応 (AVIF は不可)
Images=1
; これより画素数の多い画像は読まない (千画素単位。2000 = 200 万画素)
; デコード中は 1 画素 4 バイト使うので、メモリの少ない PC では小さくする
MaxImageKPixels=2000
; 1 ページの画像に使うメモリの上限 (KB)。超えた分は alt テキストで表示する
ImageMemoryKB=16384

; GIF / WebP のアニメーションを動かす (1) / 最初のコマだけ表示 (0)
; 読み込み中でなければ Esc キーでそのページのアニメを止められる
Animation=1
; アニメ 1 枚の全コマに使うメモリの上限 (KB)。超えるものは最初のコマだけ表示する
; (例: 200x150 で表示する 100 コマのアニメは約 9MB 必要)
MaxAnimationKB=4096

; JPEG の展開に高速な方式 (libjpeg の「fast integer」と同じ AAN 方式の IDCT) を使う (1) / 標準の方式 (0)。
; 高速な方式は掛け算が少なく、遅い PC で JPEG の表示が速くなる。画素の値が 1 ～ 3 程度違うことがあるが、
; 見た目ではほとんど区別できない
FastJpeg=1

; 小さく表示する JPEG を、元の 1/2・1/4・1/8 の大きさで展開する (1) / 常に元の大きさで展開する (0)。
; 遅い PC で大きな写真を小さく表示するページが速くなる。表示が大きくなったとき (ウィンドウを広げたなど) は、
; 必要な大きさで展開し直す
JpegReduce=1

; 透過のある画像の元の色を、展開したときに覚えておく (1) / 覚えない (0)。1 にすると透過のある画像の描画が
; 3 割ほど速くなるが、その画像が使うメモリが 7 割ほど増える
AlphaCache=0

; スタイルシート (CSS) を使う (1) / 使わない (0)。0 にすると文字中心の簡素な表示になり、
; 外部 CSS を読まないぶん速くなる (CSS で隠されている要素も表示される)
Styles=1

; 外部 CSS 1 つの上限 (KB)。超えるものは、埋め込んだ大きな画像 (64KB を超える data: URL) を外してから
; 判定し、それでも超えれば読まない
CssMaxKB=512
; 1 ページで読む CSS の合計の上限 (KB)。超えたら、それより後の外部 CSS は読まない
CssTotalKB=1536

; HTTP などで受け取る本文 1 つの上限 (KB。256～65536)。ページ・CSS・スクリプトなどをメモリに受け取るときの
; 上限 (超えたら読み込みをやめる)。「名前を付けて保存」は、ほとんどの場合ファイルへ直接書くので上限を受けない
MaxBodyKB=8192

; CSS の @font-face で指定された書体 (TrueType の .ttf だけ) を読んで使う (1) / 使わない (0)。
; Win95 には自分だけで使う書体の仕組みが無いので、一時フォルダに書いて MiniBrow を閉じるまで
; Windows に登録する (その間はほかのアプリの書体の一覧にも出る。入っている書体と同じ名前のものは使わない)。
; 書体のファイルは Windows が解釈するので、知らないサイトの書体を読みたくなければ 0 にする
WebFonts=1

; CSS の装飾 (角の丸め border-radius・影 box-shadow・グラデーション linear-gradient・mask-image のアイコン・
; 回転と拡大 transform: rotate() / scale()・画像の filter・border-image) を描く (1) / 描かない (0)。
; 0 のときは mask-image と border-image の画像も読まず、アイコンは描かず、border-image は普通の枠線で描く。
; 描くと 1 枚の画面を描く手間が増えるので、遅い PC では 0 にする。0 のときは角は四角、影は無し、
; グラデーションは最初の色で塗る
Decorations=1

; 本文の標準の文字の大きさ (px で指定する。6 ～ 72。既定は 16)。
; ポイント (pt) と px の関係: px = pt × DPI ÷ 72。画面の DPI によって変わる。
;   96 DPI (Windows の「小さいフォント」): 12pt = 16px、10pt = 13px、9pt = 12px
;   120 DPI (Windows の「大きいフォント」): 12pt = 20px、10pt = 17px
; ここに書くのは px なので、DPI を変えても大きさは変わらない。
FontSize=16

; 文字の拡大・縮小の倍率 (%。25 ～ 400。既定は 100)。起動したときの倍率になる。
; 起動してからは Ctrl + + / Ctrl + - / Ctrl + 0 と、右クリックのメニューで変えられる
; (変えた倍率はこのファイルには書き込まない)。
Zoom=100

; CSS で px や pt で指定された文字も拡大・縮小する (1) / しない (0)。
; 0 にすると、指定の無い文字と em や % で指定された文字だけが変わる (IE3 / IE4 の「文字のサイズ」に近い)。
ZoomPx=1

; CSS のカスタムプロパティ (--名前: 値) のうち、要素ごとに覚える項目の数の上限 (1 回の表示で)。
; 1 項目は十数バイトで、20000 なら数百 KB まで使う。上限を超えた分と 0 のときは、普通のルール
; (.btn { --x: … } など) で定義した値は効かず、:root・html・body・* のルールと style 属性の値だけを使う
CssVarLimit=20000

; Cookie を使う (1) / 使うが終了時に捨てる (2) / 使わない (0)
; 1 では期限付きの Cookie を minibrow.exe と同じフォルダの cookies.txt に保存する。
; ログイン状態などを消したいときは MiniBrow を閉じてから cookies.txt を削除する
Cookies=1
; (訪れたリンクの色を変えるため、訪れたページを visited.txt に 30 日分残す。URL そのものではなく
;  URL から計算した番号 (ハッシュ値) だけを書く。消すと、すべて訪れていないリンクの色に戻る)
; (スクリプトの localStorage は、1 のときだけ minibrow.exe と同じフォルダの storage フォルダに
;  サイトごとに保存する (1 サイト 1MB まで)。2 と 0 では MiniBrow を閉じると消える。
;  storage フォルダは MiniBrow を閉じている間なら削除してよい)

; JavaScript を使う (1) / 使わない (0)。Netscape 3 程度の機能 (document.write、フォーム、
; 画像の差し替え、location、タイマー、onclick などのイベント属性) に加えて、要素の木 (DOM) の
; 読み書きと表示のやり直し、addEventListener、XMLHttpRequest / fetch、localStorage、
; MutationObserver など、2010 年代前半のサイトで使われる機能の多くに対応する。
; React などで作った最近の大きなサイトは、スクリプトの量と速さの点でほとんど動かない
JavaScript=1
; 1 ページのスクリプトが使うメモリの上限 (KB)。0 なら実メモリの 1/8 にする (2048 - 32768 KB の範囲)
JSMemoryKB=0
; スクリプト 1 回 (1 つのスクリプト、1 つのイベント) の実行時間の上限 (秒)。
; 超えたらそのページのスクリプトをすべて止める
JSTimeLimit=10
; これより大きい外部スクリプト (KB) は読まない
JSMaxScriptKB=300
; 調査用: スクリプトのエラーと console.log などの出力を書き足すファイル (空なら書かない)。
; サイトのスクリプトが動かない原因を調べるときに使う。ファイル名だけなら minibrow.exe と同じフォルダに作る。
; 1 件 1 行で日時を付ける。MiniBrow を起動するたびに空にして、起動したことを 1 行書く
; (ファイルができていれば設定は効いている。ほかの MiniBrow が動いているときは空にせず、その行も書かない)。
; 64KB (Windows 95 のメモ帳で開ける大きさ) を超えそうになったら、古い方の半分ほどを捨てる。
; MiniBrow の記録ではない既にあるファイル (設定ファイルなど) を指定したときは、書き込みも削除もしない。
; 使えないとき (そのファイル・書けないパス) は、スクリプトのエラーの表示の後ろにその理由を出す
; 例: JSLog=jslog.txt
JSLog=
; window.open や target="_blank" のリンクで同時に開いておけるウィンドウの数。最初のウィンドウや
; 自分で起動した MiniBrow も数に入る。新しいウィンドウは別の minibrow.exe として起動するので、
; 1 つにつき数 MB のメモリを使う。クリックなどの操作によらない window.open (ポップアップ) は数によらず開かない。
; フレーム (<frameset>・<iframe>) もそれぞれ別の minibrow.exe で動くが、この数には入らない (1 ページ 16 個まで)
MaxWindows=2
